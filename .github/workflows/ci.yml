name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        node-version: [ 20.x ]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install root dependencies
        run: npm ci || npm install

      - name: Install client dependencies
        run: npm ci --prefix client || npm install --prefix client

      - name: Install electrone dependencies
        run: npm ci --prefix electrone || npm install --prefix electrone

      - name: Run automated unit tests
        run: npm test

      - name: Run typecheck and client build
        run: npm run typecheck

      - name: Build Electron app
        run: npm run build --prefix electrone
