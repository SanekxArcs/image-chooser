appId: com.imagechooser.app
productName: Image Chooser
directories:
  output: dist-electron
files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
win:
  target:
    - target: nsis
      arch: x64
mac:
  target:
    - dmg
    - zip
  category: public.app-category.photography
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
